services:
  cv_www:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -u -m gunicorn -k gevent -w 4 -b 0.0.0.0:5015 app:app
    volumes:
      - ./templates/:/app/templates:ro
      - ./static/:/app/static/:ro
    expose:
      - "5015"
        # command and expose here overwrite commands cmd from Dockerfile
        # -b 0.0.0.0:5015:5015 here :5015 expose 5015 
  nginx:
    image: nginx:alpine
    ports:
      - "5015:80" # listen on host:5015 redirect to port 80 nginx container
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cv_www
